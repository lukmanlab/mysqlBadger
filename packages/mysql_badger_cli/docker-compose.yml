# Requires an AIStor license saved as ./minio.license
# (free tier: https://www.min.io/pricing). Upload slow logs (*.log) to the slowlogs bucket via the console (:9001), then use http://localhost:8080.
services:
  aistor-server:
    image: quay.io/minio/aistor/minio:latest
    command: minio server /mnt/data --console-address ":9001" --license /minio.license
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/mnt/data
      - ./minio.license:/minio.license:ro

  badger:
    build: .
    entrypoint: ["mysql-badger-serve"]
    depends_on:
      - aistor-server
    restart: on-failure
    environment:
      MINIO_ENDPOINT: aistor-server:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: slowlogs
    ports:
      - "8080:8080"

volumes:
  minio-data:
